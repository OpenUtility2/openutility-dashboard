<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>OpenUtility Bot — Discord Dashboard</title>
  <style>
    :root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#1e1f22;color:#f2f3f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center}.boot{display:grid;place-items:center;text-align:center;gap:12px;color:#b5bac1}.spin{width:28px;height:28px;border:3px solid #ffffff18;border-top-color:#5865f2;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fallback{display:none;max-width:520px;margin:24px;padding:24px;background:#111318;border:1px solid #303238;border-radius:16px}.fallback h2{margin:0 0 8px}.fallback p{color:#b5bac1;line-height:1.5}.fallback a{display:inline-block;background:#5865f2;color:#fff;text-decoration:none;border-radius:8px;padding:10px 14px;font-weight:700}
  </style>
</head>
<body>
  <main class="boot" id="boot"><div class="spin"></div><div>Opening OpenUtility Discord Dashboard…</div></main>
  <main class="fallback" id="fallback">
    <h2>Dashboard couldn't open</h2>
    <p>The dashboard entry point failed to redirect. Open the dashboard directly below.</p>
    <a id="direct" href="/dashboard-core.html">Open Dashboard</a>
  </main>
  <script>
    (function(){
      var target='/dashboard-core.html'+window.location.search+window.location.hash;
      var direct=document.getElementById('direct');
      direct.href=target;
      // Do not fetch, document.write, iframe, or dynamically rebuild the dashboard here.
      // The previous bootstrap did that and could leave mobile browsers stuck forever.
      try { window.location.replace(target); }
      catch(e) {
        document.getElementById('boot').style.display='none';
        document.getElementById('fallback').style.display='block';
      }
      window.setTimeout(function(){
        if(document.visibilityState==='visible' && location.pathname==='/dashboard/'){
          document.getElementById('boot').style.display='none';
          document.getElementById('fallback').style.display='block';
        }
      },3000);
    })();
  </script>
</body>
</html>
