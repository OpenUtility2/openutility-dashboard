<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F17">
<title>OpenUtility Bot — Discord Dashboard</title>
<link rel="icon" href="/assets/openutility-bot-logo.jpg" type="image/jpeg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0F17;color:#f4f7fc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#dashboard-frame{display:block;width:100%;height:100%;border:0;background:#1e1f22}
#fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#0B0F17;z-index:2}
#fallback[hidden]{display:none}.box{width:min(520px,100%);padding:24px;box-sizing:border-box;background:#141B29;border:1px solid #273248;border-radius:16px;box-shadow:0 20px 70px #0008}.box h2{margin:0 0 8px}.box p{color:#b5bac1;line-height:1.5}.box button{background:linear-gradient(135deg,#829CFF,#A78BFA);color:#0B0F17;border:0;border-radius:7px;padding:10px 15px;font-weight:700}.box a{display:inline-block;margin-left:8px;color:#A78BFA;text-decoration:none}
</style>
</head>
<body>
<iframe id="dashboard-frame" title="OpenUtility Discord Dashboard" allow="clipboard-read; clipboard-write"></iframe>
<div id="fallback" hidden><section class="box"><h2>Dashboard unavailable</h2><p id="errorText">The dashboard could not be loaded.</p><button type="button" onclick="location.reload()">Try again</button><a href="/">OpenUtility home</a></section></div>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('dashboard-frame');
  const fallback=document.getElementById('fallback');
  const errorText=document.getElementById('errorText');
  const query=window.location.search||'';
  let settled=false;
  const showError=(message)=>{if(settled)return;settled=true;errorText.textContent=message;fallback.hidden=false;};
  const inject=(doc,src)=>new Promise((resolve,reject)=>{
    if(doc.querySelector('script[data-ou-shell="'+src+'"]'))return resolve();
    const s=doc.createElement('script');s.src=src;s.async=false;s.dataset.ouShell=src;
    s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load '+src));doc.body.appendChild(s);
  });
  const enhance=async()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc||!doc.body)throw new Error('Dashboard document is unavailable.');
      await inject(doc,'/dashboard-reliability.js?v=20261010-1');
      await inject(doc,'/discord-theme.js?v=20261010-1');
      await inject(doc,'/dashboard-hardening.js?v=20261010-1');
      const style=doc.createElement('style');
      style.textContent='@media(max-width:950px){.layout{grid-template-columns:1fr!important;gap:18px!important}.side{position:static!important;display:flex!important;gap:4px!important;overflow-x:auto!important;max-width:100%!important}.side small{display:none!important}.side button{flex:0 0 auto!important;width:auto!important;white-space:nowrap!important}.side button.active:before{display:none!important}}@media(max-width:650px){html,body{min-width:0!important;width:100%!important;overflow-x:hidden!important}body{padding-bottom:calc(78px + env(safe-area-inset-bottom))!important}.wrap{width:calc(100% - 24px)!important}.layout{display:block!important;padding:14px 0 24px!important}.side{display:none!important}.content{min-width:0!important}.serverbar{max-width:none!important;margin-bottom:18px!important}.content h1{font-size:30px!important;letter-spacing:-1.1px!important}.cards{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}.actions{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}.formgrid,.embedgrid{grid-template-columns:minmax(0,1fr)!important}.panel{padding:16px!important}.savebar{align-items:stretch!important;flex-direction:column!important}.savebar .btn{width:100%!important}.mobilebar{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:999!important;height:calc(68px + env(safe-area-inset-bottom))!important;padding:7px 5px calc(7px + env(safe-area-inset-bottom))!important;background:#0a0e17f5!important;border-top:1px solid #ffffff18!important;backdrop-filter:blur(18px)!important}.mobilebar button{display:block!important;min-width:0!important}.toast{bottom:calc(82px + env(safe-area-inset-bottom))!important}}';
      doc.head.appendChild(style);
      settled=true;
    }catch(e){showError(e&&e.message?e.message:'The dashboard loaded but could not initialize its interface.');}
  };
  frame.addEventListener('load',enhance);
  frame.addEventListener('error',()=>showError('The dashboard core could not be loaded.'));
  setTimeout(()=>{if(!settled&&frame.contentDocument&&frame.contentDocument.body)enhance();else if(!settled)showError('The dashboard took too long to load.');},12000);
  frame.src='/dashboard-core.html'+query+(query?'&':'?')+'v=20261010-3';
})();
</script>
</body>
</html>
