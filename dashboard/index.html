<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenUtility Bot — Discord Dashboard</title>
<link rel="icon" href="/assets/openutility-bot-logo.jpg" type="image/jpeg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060910;color:#f2f3f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#dashboard-frame{display:block;width:100%;height:100%;border:0;background:#060910}
#fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#060910;z-index:2}
#fallback[hidden]{display:none}
.box{width:min(520px,100%);padding:24px;box-sizing:border-box;background:#0b111b;border:1px solid #1d2939;border-radius:18px;box-shadow:0 20px 80px #0008}
.box h2{margin:0 0 8px;color:#f5f7fb}.box p{margin:0 0 18px;color:#8996a8;line-height:1.55}.box button{border:0;border-radius:10px;background:#5865f2;color:#fff;padding:11px 15px;font-weight:750}.box a{display:inline-flex;margin-left:8px;color:#cbd4e0;text-decoration:none}
</style>
</head>
<body>
<iframe id="dashboard-frame" title="OpenUtility Discord Dashboard" src="/dashboard-core.html" allow="clipboard-read; clipboard-write"></iframe>
<div id="fallback" hidden>
  <section class="box">
    <h2>Dashboard unavailable</h2>
    <p>The dashboard could not be displayed. Reload it or open the dashboard directly.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a href="/dashboard-core.html">Open dashboard</a>
  </section>
</div>
<script>
(function(){
  const frame=document.getElementById('dashboard-frame');
  const fallback=document.getElementById('fallback');
  let loaded=false;
  const timer=setTimeout(function(){if(!loaded)fallback.hidden=false},15000);
  frame.addEventListener('load',function(){loaded=true;clearTimeout(timer);fallback.hidden=true;try{document.title=frame.contentDocument.title||'OpenUtility Bot — Discord Dashboard'}catch(e){}});
  frame.addEventListener('error',function(){clearTimeout(timer);fallback.hidden=false});
})();
</script>
</body>
</html>
