<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenUtility Bot — Discord Dashboard</title>
<style>
html,body{margin:0;background:#1e1f22;color:#f2f3f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh}.loader{min-height:100vh;display:grid;place-items:center;text-align:center;color:#b5bac1}.spin{width:30px;height:30px;border:3px solid #ffffff18;border-top-color:#5865f2;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}.err{max-width:460px;margin:20vh auto;padding:24px;text-align:center}.err button{background:#5865f2;color:#fff;border:0;border-radius:4px;padding:10px 15px;font-weight:700}
</style>
</head>
<body>
<div class="loader" id="loader"><div><div class="spin"></div>Loading OpenUtility Discord Dashboard…</div></div>
<script>
(async()=>{
  try{
    const r=await fetch('../dashboard-core.html?v=20261005-reliability',{cache:'no-store'});
    if(!r.ok) throw new Error('Dashboard could not be loaded.');
    let html=await r.text();
    html=html.replaceAll('./assets/openutility-bot-logo.jpg','../assets/openutility-bot-logo.jpg');
    html=html.replace("}catch(e){location.href='./?auth=required'}","}catch(e){window.__openutilityBootError?window.__openutilityBootError(e):location.href='./?auth=required'}");
    html=html.replace('</head>',`<script>window.__openutilityBootError=${function(e){const m=String(e?.message||e||'The dashboard could not start.').replace(/[<>]/g,'');document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#060910;color:#f2f3f5;font-family:system-ui"><div style="max-width:480px;background:#0b111b;border:1px solid #1d2939;border-radius:18px;padding:28px"><h2>Dashboard unavailable</h2><p style="color:#8996a8">'+m+'</p><button onclick="location.reload()" style="background:#5865f2;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700">Try again</button></div></div>';}}</script></head>`);
    html=html.replace('</body>',`<script src="../dashboard-reliability.js?v=20261005-1"><\/script><script src="../discord-theme.js?v=20261005-reliability"><\/script><script src="../dashboard-hardening.js?v=20261005-reliability"><\/script></body>`);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loader').outerHTML='<div class="err"><h2>Dashboard unavailable</h2><p>'+String(e.message).replace(/[<>]/g,'')+'</p><button onclick="location.reload()">Try again</button></div>';
  }
})();
</script>
</body>
</html>
